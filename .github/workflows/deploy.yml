name: Build and publish static website

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer run never interrupts a publication. Old runs also check main again
# immediately before publishing, so queued reruns cannot roll the website back.
concurrency:
  group: green-shade-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'loyee001/tianqi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test packaging boundaries
        run: node scripts/package-site.mjs --self-test
      - name: Test application
        run: npm test
      - name: Build static files
        run: npm run build
      - name: Package checked static files
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/package-site.mjs
      - name: Store this run's release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site-${{ github.sha }}
          path: |
            release/site/manifest.json
            release/site/site.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    needs: build
    if: github.repository == 'loyee001/tianqi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job can write. It never checks out or executes application code.
    permissions:
      contents: write
    steps:
      - name: Download the artifact from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-site-${{ github.sha }}
          path: publish-input
      - name: Publish only the current main commit
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          # Validate downloaded bytes before constructing the artifact-only branch.
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('publish-input')
          assert sorted(p.name for p in root.iterdir()) == ['manifest.json', 'site.tar.gz']
          assert all(p.is_file() and not p.is_symlink() for p in root.iterdir())
          assert root.joinpath('manifest.json').stat().st_size <= 256 * 1024
          manifest = json.loads(root.joinpath('manifest.json').read_text())
          assert manifest['schema_version'] == 1
          assert manifest['repository'] == 'loyee001/tianqi'
          assert manifest['branch'] == 'main'
          assert re.fullmatch('[0-9a-f]{40}', manifest['source_sha'])
          assert manifest['source_sha'] == os.environ['SOURCE_SHA']
          archive = root.joinpath('site.tar.gz')
          assert manifest['archive']['path'] == archive.name
          assert 0 < archive.stat().st_size <= 60 * 1024 * 1024
          assert manifest['archive']['bytes'] == archive.stat().st_size
          assert manifest['archive']['sha256'] == hashlib.sha256(archive.read_bytes()).hexdigest()
          assert 1 <= len(manifest['files']) <= 500
          PY

          repo_url='https://github.com/loyee001/tianqi.git'
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 --wrap=0)"
          echo "::add-mask::$auth_header"
          # Keep authentication out of files, remote URLs and process arguments.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0='credential.helper'
          export GIT_CONFIG_VALUE_0=''
          export GIT_CONFIG_KEY_1='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_1="$auth_header"

          refs="$(git ls-remote --refs "$repo_url" refs/heads/main refs/heads/production)"
          main_sha="$(printf '%s\n' "$refs" | awk '$2 == "refs/heads/main" { print $1 }')"
          production_sha="$(printf '%s\n' "$refs" | awk '$2 == "refs/heads/production" { print $1 }')"
          if [ "$main_sha" != "$SOURCE_SHA" ]; then
            echo 'Skipped an outdated source commit; main has moved.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          publish_dir="$(mktemp -d "$RUNNER_TEMP/green-production.XXXXXX")"
          trap 'rm -rf "$publish_dir"' EXIT
          git init --quiet --initial-branch=production "$publish_dir"
          cp publish-input/manifest.json publish-input/site.tar.gz "$publish_dir/"
          git -C "$publish_dir" add -- manifest.json site.tar.gz
          git -C "$publish_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet -m "Publish static site from $SOURCE_SHA"

          # Recheck immediately before push, including manually rerun old workflows.
          current_main="$(git ls-remote --refs "$repo_url" refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')"
          if [ "$current_main" != "$SOURCE_SHA" ]; then
            echo 'Skipped publication because main changed during preparation.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Each production revision is an orphan commit containing two files.
          # The exact lease prevents overwriting a concurrent external publication.
          git -C "$publish_dir" push --force-with-lease="refs/heads/production:$production_sha" "$repo_url" HEAD:refs/heads/production
          echo "Published static package for source commit $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
